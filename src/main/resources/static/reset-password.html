<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MiniCache | Reset Password</title>

    <link rel="stylesheet"
          href="auth.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="auth-page">

    <div class="auth-brand">

        <div class="brand-logo">
            <i class="fa-solid fa-database"></i>
        </div>

        <div>
            <h1>MiniCache</h1>

            <p>
                High-Performance In-Memory Cache
            </p>
        </div>

    </div>


    <div class="auth-card">

        <div class="auth-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <h2>Reset your password</h2>

        <p class="subtitle">
            Create a new password for your account
        </p>


        <form id="resetPasswordForm">

            <div class="input-group">

                <label>
                    New Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            required>

                    <i
                            class="fa-solid fa-eye password-toggle"
                            id="newPasswordToggle">
                    </i>

                </div>

            </div>


            <div class="input-group">

                <label>
                    Confirm Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="8"
                            required>

                    <i
                            class="fa-solid fa-eye password-toggle"
                            id="confirmPasswordToggle">
                    </i>

                </div>

            </div>


            <button
                    type="submit"
                    class="primary-btn">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>


            <p
                    id="resetMessage"
                    class="auth-message">
            </p>

        </form>


        <div class="divider">
            <span>Remember your password?</span>
        </div>


        <button
                class="secondary-btn"
                id="goToLogin">

            <i class="fa-solid fa-right-to-bracket"></i>

            Back to Login

        </button>

    </div>


    <p class="footer-text">

        © 2026 MiniCache · Secure · Fast · Reliable

    </p>

</div>


<script src="reset-password.js"></script>

</body>

</html>
